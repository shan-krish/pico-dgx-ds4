# The fleet: four DGX Spark boxes (drowzeys/keys DeepSeek-V4.1-Flash-1017 ring), switchless.
#
# Cabling is a directed ring on the ConnectX-7 ports, which is what ring.sh checks:
#   rank r's f0 (NEXT_*) -> rank r+1's f1 (PREV_*), and rank 3's f0 -> rank 0's f1.
# Addresses: link r->r+1 is 10.10.(210+r).0/24 on PCI domain 0 and 10.10.(220+r).0/24 on domain 2.
# So rank r is 10.10.(210+r).1 / 10.10.(220+r).1 toward r+1, and 10.10.(210+r-1).2 / 10.10.(220+r-1).2
# toward r-1. RoCE v2 GID index 3 everywhere (verified with show_gids on all four boxes).
#
# These are the production boxes of the DeepSeek ring: while the SGLang engine is serving, do NOT run
# ring.sh/run4.sh here - they take the ring. Rank 0 is also where dsfront runs.

NEXT_DEV0=rocep1s0f0
NEXT_DEV1=roceP2p1s0f0
PREV_DEV0=rocep1s0f1
PREV_DEV1=roceP2p1s0f1
GID_INDEX=3

BIN_DIR=~/dsgb10/bin
LOG_DIR=~/dsgb10/logs
SERVICE_DIR=~/dsgb10/service
RING_LOCK=~/dsgb10/ring.lock

# Rank 0: the head box (10.10.1.102), where the scripts and dsfront run
RANK0_NAME=spark-1e29
RANK0_HOSTNAME=spark-1e29
RANK0_NEXT_IP0=10.10.210.1
RANK0_NEXT_IP1=10.10.220.1
RANK0_PREV_IP0=10.10.213.2
RANK0_PREV_IP1=10.10.223.2
RANK0_WEIGHTS=~/rankfiles/rank0.dsw
RANK0_HASHMAP=~/rankfiles/engram_hashmap.bin
RANK0_ENGRAM=~/rankfiles
RANK0_ENGRAM_READ_BATCH=1
RANK0_SPILL=~/rankfiles/spill

